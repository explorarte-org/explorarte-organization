    - capability_id: OC-web-evidence-ingest
      name: Ephemeral web evidence ingest, sanitize, and rank
      behavioral_contract: >-
        When a URL is ingested, the system fetches through a Fetcher, sanitizes/chunks the body into
        bounded ephemeral chunks (<=1200 bytes) with audit-only injection detection, computes a
        content hash, validates TTL within [MinTTL,MaxTTL], and returns validated Evidence without
        persisting; RankChunks later fuses lexical keyword overlap with optional vector similarity via
        RRF (k=60) for per-query ranking.
      causal_purpose: Provide validated, bounded, non-instructional web evidence chunks for per-task ranking.
      entrypoints_or_triggers:
        - internal/webevidence/ingest.go:33:Ingest
        - internal/webevidence/rank.go:70:RankChunks
      enforcement_or_transition_points:
        - internal/webevidence/sanitize.go:45:Sanitize
        - internal/webevidence/types.go:88:Validate
      reads_or_inputs:
        - url, RawPage, ttl, IDGenerator
      writes_or_effects:
        - validated Evidence{Chunks, SanitizationFindings, ContentHash}; []RankedChunk
      implementation_provenance:
        - internal/webevidence/ingest.go
        - internal/webevidence/sanitize.go
        - internal/webevidence/rank.go
        - internal/webevidence/types.go
      declaration_provenance:
        - internal/webevidence/store.go
      configuration_provenance: []
      possible_runtime_evidence:
        - internal/webevidence/postgres/store.go (Save/Get/ListForTask/Reap)
      boundary_with_adjacent_capabilities: >-
        Adjacent to OC-rag-knowledge-lifecycle (permanent approved-knowledge retrieval) and
        OC-evidence-object-storage (immutable object persistence). Split: this owns ephemeral web
        evidence ingest/rank; RAG owns approved knowledge; object storage owns immutable persistence.
      classification_basis: >-
        Q1 YES; Q2 YES; Q3 YES (Ingest/RankChunks); Q4 YES (validated Evidence); Q5 NO; Q6 NO.
