    - capability_id: OC-context-profile-projection
      name: Per-task-class context profile projection over canonical snapshots
      behavioral_contract: >-
        When a canonical contextengine.Snapshot is presented to Compile/CompileForTaskClass,
        the system selects a ContextProfile by TaskClassOf(actorRoleID), fails closed to the
        unprojected canonical view (FellBackToCanonical=true) when a RequiredTiers segment is
        missing or the task class is unregistered, and otherwise applies only registered
        per-SourceReference projections that can shrink (never grow or reorder) segment content,
        recomputing per-segment content hashes.
      causal_purpose: Reduce token/budget exposure for specific task classes without letting a
        partial view silently omit a required tier.
