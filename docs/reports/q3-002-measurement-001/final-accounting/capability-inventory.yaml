- capability_id: OC-evaluation-comparison
  name: Evaluation suite execution and baseline/candidate comparison
  behavioral_contract: When a suite is evaluated, the system loads each case's trace,
    verifies the evaluator result is actually about the requested case/role/trace,
    runs baseline and candidate roles, and reduces per-case metric deltas into a SuiteComparisonResult
