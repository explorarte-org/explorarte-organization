  name: Provider wallet reserve/commit/release cost ledger
  behavioral_contract: When a model or embedding invocation reserves spend, the system
    reserves funds against the provider wallet and later commits or releases exactly
    once; the database-level terminal-event index rejects a reservation becoming both
    committed and released, and orphaned reservations can be listed for reconciliation.
  causal_purpose: Track and bound real-money provider spend with double-settlement
    protection.
