- capability_id: OC-capability-authorization
  name: Capability approval request/decide/consume authorization
  behavioral_contract: When a capability-gated action is evaluated, the system applies
    a default-deny capability matrix (grants, hard-denies, approval modes) with organization/revision/
    matrix-hash/role checks; when approval is required it creates an approval request
    that a decider must approve before the action can be consumed, and consumption
    is rejected on pending/rejected/expired/consumed/cancelled or scope/policy drift.
  causal_purpose: Enforce least-privilege, auditable, drift-checked capability authorization
    across the organization.
