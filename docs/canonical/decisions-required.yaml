branch: docs/00-canonical-spec
status: requires_owner_approval_before_branch_01
accepted_from_owner:
- Seven operational departments.
- Empresa and Investigación are transversal units.
- Research is leaderless.
- CEO target is Qwen 3.6 Flash.
- Department leaders use GPT Luna.
- Workers default to DeepSeek V4 Flash.
- Cells run independently from the organization.
- The kernel is primarily Go and uses goroutines for concurrency, not durability.
