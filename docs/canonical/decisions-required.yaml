branch: docs/00-canonical-spec
status: requires_owner_approval_before_branch_01
accepted_from_owner:
- Four operational departments after the negocio consolidation (comunicaciones, creativo, finanzas and marketing merged
  into negocio); see organization.yaml.
- Empresa and Investigación are transversal units.
- Research is leaderless.
- Provider and model selection is decided exclusively in model-routing.yaml (one source_of_decision per policy); this
  file no longer restates provider or model names.
- Cells run independently from the organization.
- The kernel is primarily Go and uses goroutines for concurrency, not durability.
