  normative_contract:
    sha256: cbf4b72975b4a8d8c2650969181f470d7a91fbf5f35beeabd23eb66a03f6e11c
    meaning: >-
      Byte-exact normative contract governing future Q3-002 classifications:
      operational definition, Q1-Q6 decision procedure, artifact-role taxonomy,
      granularity rules, required positive-record schema, and exclusions.
    source_encoding: UTF-8
    start_marker_inclusive: "## 1. Operational definition\n"
    end_marker_exclusive: "## Appendix A — ontology derivation set (closed before freeze)\n"
    zero_based_start_offset: 415
    zero_based_end_offset_exclusive: 11987
    byte_length: 11572
    range_notation: "[415,11987)"
    transformation: none
    derivation_rule: >-
      Read the artifact as raw bytes. Locate the first exact UTF-8 byte sequence
      equal to start_marker_inclusive and include it. Starting from that offset,
      locate the first exact UTF-8 byte sequence equal to end_marker_exclusive
      and exclude it. Hash every byte in the resulting half-open range exactly
      as stored. Do not decode/re-encode, normalize Unicode, trim whitespace,
      convert newlines, or reserialize content. The newline bytes immediately
      preceding end_marker_exclusive remain included.
    reference_algorithm_python: |
      from hashlib import sha256
      from pathlib import Path

      artifact = Path("docs/canonical/q3-organizational-capability-ontology-v1.md")
      raw = artifact.read_bytes()
      start_marker = b"## 1. Operational definition\n"
      end_marker = (
          "## Appendix A — ontology derivation set (closed before freeze)\n"
          .encode("utf-8")
      )
      start = raw.index(start_marker)
      end = raw.index(end_marker, start)
      normative = raw[start:end]
      assert start == 415
      assert end == 11987
      assert len(normative) == 11572
      assert sha256(normative).hexdigest() == (
          "cbf4b72975b4a8d8c2650969181f470d7a91fbf5f35beeabd23eb66a03f6e11c"
      )

