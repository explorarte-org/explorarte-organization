name: Apply and validate Capa 11 snapshot

on:
  push:
    branches:
      - feat/11-model-execution-identity

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout staged branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install validation tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Reconstruct and apply verified snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .github/capa11-patch/part-* > /tmp/capa11.patch.gz.b64
          base64 --decode /tmp/capa11.patch.gz.b64 > /tmp/capa11.patch.gz
          echo "e009645bddab1875a19736f3f6c47a8ff829532533b275b7218e369473d50872  /tmp/capa11.patch.gz" | sha256sum --check -
          gzip --decompress --stdout /tmp/capa11.patch.gz > /tmp/capa11.patch
          echo "3252fc78b9e461a4b2d39fdf03c4161218967f7d2957fa15cef722df60dac9a8  /tmp/capa11.patch" | sha256sum --check -
          git apply --check /tmp/capa11.patch
          git apply /tmp/capa11.patch
          rm -rf .github/capa11-patch .github/workflows/apply-capa11.yml
          git diff --check

      - name: Download and verify modules
        run: go mod download && go mod verify

      - name: Identity and model race tests
        run: |
          go test -race -short ./internal/modelidentity/... ./internal/secrets/...
          go test -race -short ./internal/modelruntime/...
          go test -race -short ./internal/modeldispatch/...
          go test -race -short ./internal/modelegress/...

      - name: Exact aggregate validation
        run: make verify-all

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Multi-architecture Docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(models): add cryptographic execution identity"
          git push origin HEAD:feat/11-model-execution-identity
