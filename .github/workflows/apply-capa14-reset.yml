name: Apply Capa 14 root reset update

on:
  push:
    branches: [feat/14-durable-decision-graph]
    paths:
      - ".rama14-reset/**"
      - ".github/workflows/apply-capa14-reset.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply reset update
        run: |
          set -euo pipefail
          python3 .rama14-reset/apply.py
          rm -rf .rama14-reset
          gofmt -w internal/platform/postgres/integration_test.go
          git diff --check
      - name: Commit reset update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(postgres): reset durable branch events"
          git push origin HEAD:feat/14-durable-decision-graph
