# Transfer runner for Branch 07; it retains itself until GitHub-side cleanup.
name: context-engine-apply

on:
  push:
    branches: ["feat/07-context-engine"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: explorarte_test
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: explorarte_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U explorarte_test -d explorarte_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ORG_TEST_DATABASE_URL: postgres://explorarte_test:integration-only-password@127.0.0.1:5432/explorarte_test?sslmode=disable
      ORG_DATABASE_URL: postgres://explorarte_test:integration-only-password@127.0.0.1:5432/explorarte_test?sslmode=disable
      ORG_CANONICAL_DIR: docs/canonical
      CONTEXT_BASE_SHA: bfe21f34d1da3f2d51eb520c4deef635c7f49cab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/07-context-engine
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep xz-utils
      - name: Verify multipart payload and apply
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/07-context-engine"
          test "$(find .github/context-parts -maxdepth 1 -type f -name '*.b64' | wc -l)" -eq 8
          cat .github/context-parts/*.b64 > /tmp/context-engine.patch.xz.b64
          test "$(sha256sum /tmp/context-engine.patch.xz.b64 | cut -d' ' -f1)" = "84b20205725996004ad33dc212acd1da776ad1ec53e329f8dba50ddaab964a68"
          base64 -d /tmp/context-engine.patch.xz.b64 | xz -d > /tmp/context-engine.patch
          test "$(sha256sum /tmp/context-engine.patch | cut -d' ' -f1)" = "855c6ecc23cd5f941349b2bb4b41ea6b651d073f9fb4b54817fca5a9fccbb296"
          git checkout "$CONTEXT_BASE_SHA" -- .github/workflows/ci.yml
          git apply --check /tmp/context-engine.patch
          git apply /tmp/context-engine.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path("internal/contextengine/postgres/integration_test.go")
          text = path.read_text()
          old_insert = '''\t\t_, err = platform.Pool().Exec(ctx, `INSERT INTO organization_registry_revisions(id,canonical_hash,status,schema_versions,document_hashes,counts,diff,applied_at) OVERRIDING SYSTEM VALUE VALUES($1,$2,'applied','{}','{}','{}','{}',NOW()); UPDATE organizations SET current_revision_id=$1 WHERE id=$3`, newRevisionID, contextengine.DigestMarkdown([]byte("new revision")), integrationOrganization)
          \t\tif err != nil {
          \t\t\tt.Fatal(err)
          \t\t}
          '''
          new_insert = '''\t\t_, err = platform.Pool().Exec(ctx, `INSERT INTO organization_registry_revisions(id,canonical_hash,status,schema_versions,document_hashes,counts,diff,applied_at) OVERRIDING SYSTEM VALUE VALUES($1,$2,'applied','{}','{}','{}','{}',NOW())`, newRevisionID, contextengine.DigestMarkdown([]byte("new revision")))
          \t\tif err != nil {
          \t\t\tt.Fatal(err)
          \t\t}
          \t\t_, err = platform.Pool().Exec(ctx, `UPDATE organizations SET current_revision_id=$1 WHERE id=$2`, newRevisionID, integrationOrganization)
          \t\tif err != nil {
          \t\t\tt.Fatal(err)
          \t\t}
          '''
          old_cleanup = '''\t\t_, err = platform.Pool().Exec(ctx, `UPDATE organizations SET current_revision_id=$1 WHERE id=$2; DELETE FROM organization_registry_revisions WHERE id=$3`, revision.ID, integrationOrganization, newRevisionID)
          \t\tif err != nil {
          \t\t\tt.Fatal(err)
          \t\t}
          '''
          new_cleanup = '''\t\t_, err = platform.Pool().Exec(ctx, `UPDATE organizations SET current_revision_id=$1 WHERE id=$2`, revision.ID, integrationOrganization)
          \t\tif err != nil {
          \t\t\tt.Fatal(err)
          \t\t}
          \t\t_, err = platform.Pool().Exec(ctx, `DELETE FROM organization_registry_revisions WHERE id=$1`, newRevisionID)
          \t\tif err != nil {
          \t\t\tt.Fatal(err)
          \t\t}
          '''
          if old_insert not in text or old_cleanup not in text:
              raise SystemExit("expected PostgreSQL drift fixture blocks not found")
          path.write_text(text.replace(old_insert, new_insert).replace(old_cleanup, new_cleanup))
          PY
          rm -f .github/context-engine.patch.xz.b64
          rm -rf .github/context-parts
          gofmt -w cmd/orgctl internal/config internal/contextengine
          git diff --check
          git diff --exit-code "$CONTEXT_BASE_SHA" -- docs/canonical
      - name: Unit, race, fitness and PostgreSQL validation
        run: |
          set -euo pipefail
          go test -short ./...
          go test -race -short ./internal/contextengine/...
          make test-context-fitness
          make test-authorization-fitness
          make test-task-fitness
          make test-staging-fitness
          make build-cross
          make registry-validate
          make test-context-integration
          make test-authorization-integration
          make test-staging-integration
      - name: Commit implementation without workflow changes
        run: |
          set -euo pipefail
          test ! -e .github/context-engine.patch.xz.b64
          test ! -e .github/context-parts
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/context-engine-bootstrap.yml
          git diff --exit-code "$CONTEXT_BASE_SHA" -- docs/canonical
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Makefile cmd/orgctl internal/config internal/contextengine migrations scripts docs/implementation/branch-07-context-engine
          git add -u .github
          git diff --cached --name-only | grep '^docs/canonical/' && exit 1 || true
          git diff --cached --name-only | grep '^.github/workflows/' && exit 1 || true
          git commit -m "feat(context): add deterministic durable context engine"
          git push origin HEAD:feat/07-context-engine
