name: context-engine-bootstrap

on:
  push:
    branches: ["feat/07-context-engine"]

permissions:
  contents: read

jobs:
  preconditions-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: explorarte_test
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: explorarte_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U explorarte_test -d explorarte_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ORG_TEST_DATABASE_URL: postgres://explorarte_test:integration-only-password@127.0.0.1:5432/explorarte_test?sslmode=disable
      ORG_DATABASE_URL: postgres://explorarte_test:integration-only-password@127.0.0.1:5432/explorarte_test?sslmode=disable
      ORG_CANONICAL_DIR: docs/canonical
      BASE_SHA: bfe21f34d1da3f2d51eb520c4deef635c7f49cab
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify branch and checkout canonical base
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/07-context-engine"
          git cat-file -e "$BASE_SHA^{commit}"
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          printf 'initial_sha=%s\nbranch=%s\n' "$(git rev-parse HEAD)" "$GITHUB_REF_NAME" | tee /tmp/context-preconditions.txt
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Record versions
        run: |
          set -euo pipefail
          go version | tee -a /tmp/context-preconditions.txt
          psql --version | tee -a /tmp/context-preconditions.txt
      - name: Verify base
        run: |
          set -euo pipefail
          make verify 2>&1 | tee /tmp/make-verify.log
      - name: Authorization integration
        run: |
          set -euo pipefail
          make test-authorization-integration 2>&1 | tee /tmp/test-authorization-integration.log
      - name: Staging integration
        run: |
          set -euo pipefail
          make test-staging-integration 2>&1 | tee /tmp/test-staging-integration.log
      - name: Export validated base repository
        run: |
          set -euo pipefail
          mkdir -p /tmp/context-engine-base
          git archive --format=tar "$BASE_SHA" | tar -x -C /tmp/context-engine-base
          cp /tmp/context-preconditions.txt /tmp/context-engine-base/PRECONDITIONS.txt
          cp /tmp/make-verify.log /tmp/context-engine-base/MAKE_VERIFY.log
          cp /tmp/test-authorization-integration.log /tmp/context-engine-base/AUTHORIZATION_INTEGRATION.log
          cp /tmp/test-staging-integration.log /tmp/context-engine-base/STAGING_INTEGRATION.log
          tar -C /tmp -czf /tmp/context-engine-base.tar.gz context-engine-base
      - name: Upload validated base
        uses: actions/upload-artifact@v4
        with:
          name: context-engine-base
          path: /tmp/context-engine-base.tar.gz
          retention-days: 3
