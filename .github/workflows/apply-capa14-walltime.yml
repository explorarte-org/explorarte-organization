name: Apply Capa 14 durable wall-time budgets

on:
  push:
    branches: [feat/14-durable-decision-graph]
    paths:
      - ".rama14-walltime/**"
      - ".github/workflows/apply-capa14-walltime.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-capa14-durable-walltime
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply deterministic wall-time update
        run: |
          set -euo pipefail
          python3 .rama14-walltime/apply.py
          rm -rf .rama14-walltime
          gofmt -w internal/decisiongraph/postgres/store.go internal/decisiongraph/postgres/integration_test.go
          git diff --check

      - name: Commit durable wall-time budgets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(decisiongraph): consume durable wall-time budgets"
          git push origin HEAD:feat/14-durable-decision-graph
