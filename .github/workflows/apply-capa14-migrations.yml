name: Apply Capa 14 migration compatibility

on:
  push:
    branches: [feat/14-durable-decision-graph]
    paths:
      - ".rama14-migrations/**"
      - ".github/workflows/apply-capa14-migrations.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-capa14-migration-compatibility
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply deterministic migration updates
        run: |
          set -euo pipefail
          python3 .rama14-migrations/apply.py
          rm -rf .rama14-migrations
          gofmt -w internal/modelidentity/postgres/integration_test.go internal/modelegress/postgres/integration_test.go internal/contextengine/postgres/integration_test.go internal/modelruntime/postgres/integration_test.go
          git diff --check

      - name: Commit migration compatibility
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(postgres): account for decision graph migration"
          git push origin HEAD:feat/14-durable-decision-graph
