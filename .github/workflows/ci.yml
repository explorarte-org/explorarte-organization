name: ci

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, rootless]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve change base
        id: change_base
        run: |
          # ONLY a push to main audits against the event's previous commit;
          # work branches (fix/**, feat/**, PRs) audit their own delta
          # against the merge-base with the target line. The resolved base
          # is EXPORTED so every downstream fitness check in this job
          # audits exactly the same delta -- otherwise make verify would
          # silently fall back to HEAD-on-main and see an empty diff.
          if [[ "${{ github.event_name }}" == "push" &&
                "${{ github.ref }}" == "refs/heads/main" ]]; then
            before="${{ github.event.before }}"
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "$before^{commit}" 2>/dev/null; then
              base="$before"
            else
              base="$(bash scripts/resolve-task-base.sh)"
            fi
          else
            base="$(bash scripts/resolve-task-base.sh)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "TASK_ENGINE_BASE_COMMIT=$base" >> "$GITHUB_ENV"
      - name: Install CI tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Download and verify modules
        run: go mod download && go mod verify
      - name: Canonical immutability of this change
        run: bash scripts/check-canonical-immutability.sh "${{ steps.change_base.outputs.base }}"
      - name: Git whitespace validation of this change
        run: git diff --check "${{ steps.change_base.outputs.base }}"...HEAD
      - name: Full non-integration verification
        run: make verify
      - name: Context engine race tests
        run: go test -race -short ./internal/contextengine/...
      - name: Model runtime race tests
        run: go test -race -short ./internal/modelruntime/...
      - name: Model egress race tests
        run: go test -race -short ./internal/modelegress/...
      - name: Model dispatch race tests
        run: go test -race -short ./internal/modeldispatch/...
      - name: Model identity race tests
        run: go test -race -short ./internal/modelidentity/... ./internal/secrets/...
      - name: OpenAI-compatible provider race tests
        run: go test -race -short ./internal/modelruntime/adapter/openaicompat/... ./internal/secrets/...
      - name: Persistent cell worker race tests
        run: go test -race -short ./internal/cellworker/...
      - name: Durable decision graph race tests
        run: go test -race -short ./internal/decisiongraph/...
      - name: Cross builds
        run: make build-cross
      - name: Validate canonical registry
        run: make registry-validate
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Multi-architecture Docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly

  postgres-final-validation:
    runs-on: [self-hosted, rootless]
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve change base
        id: change_base
        run: |
          # ONLY a push to main audits against the event's previous commit;
          # work branches (fix/**, feat/**, PRs) audit their own delta
          # against the merge-base with the target line. The resolved base
          # is EXPORTED so every downstream fitness check in this job
          # audits exactly the same delta -- otherwise make verify would
          # silently fall back to HEAD-on-main and see an empty diff.
          if [[ "${{ github.event_name }}" == "push" &&
                "${{ github.ref }}" == "refs/heads/main" ]]; then
            before="${{ github.event.before }}"
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "$before^{commit}" 2>/dev/null; then
              base="$before"
            else
              base="$(bash scripts/resolve-task-base.sh)"
            fi
          else
            base="$(bash scripts/resolve-task-base.sh)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "TASK_ENGINE_BASE_COMMIT=$base" >> "$GITHUB_ENV"
      - name: Install CI tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Download and verify modules
        run: go mod download && go mod verify
      - name: Canonical immutability of this change
        run: bash scripts/check-canonical-immutability.sh "${{ steps.change_base.outputs.base }}"
      - name: Full verification including PostgreSQL 17 integration and CLI smoke tests
        run: make verify-all
