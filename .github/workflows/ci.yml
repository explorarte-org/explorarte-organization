name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install CI tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Download and verify modules
        run: go mod download && go mod verify
      - name: Canonical documents unchanged from Branch 08 base
        run: git diff --exit-code 6d7b71acdeba7a70d552764c1d96f7bf9d907e6d -- docs/canonical
      - name: Git whitespace validation
        run: git diff --check 6d7b71acdeba7a70d552764c1d96f7bf9d907e6d...HEAD
      - name: Full non-integration verification
        run: make verify
      - name: Context engine race tests
        run: go test -race -short ./internal/contextengine/...
      - name: Model runtime race tests
        run: go test -race -short ./internal/modelruntime/...
      - name: Cross builds
        run: make build-cross
      - name: Validate canonical registry
        run: make registry-validate
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Multi-architecture Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly

  postgres-final-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install CI tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Download and verify modules
        run: go mod download && go mod verify
      - name: Canonical documents unchanged from Branch 08 base
        run: git diff --exit-code 6d7b71acdeba7a70d552764c1d96f7bf9d907e6d -- docs/canonical
      - name: PostgreSQL 17 complete integration suite and CLI smoke tests
        run: make test-integration
      - name: Context engine PostgreSQL 17 integration
        run: make test-context-integration
      - name: Authorization PostgreSQL 17 integration
        run: make test-authorization-integration
      - name: Staging PostgreSQL 17 and real Git integration
        run: make test-staging-integration
      - name: Exact aggregate verification
        run: make verify-all
