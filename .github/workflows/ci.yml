name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: write

jobs:
  apply-decision-cli:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply pending decision CLI wiring
        run: |
          set -euo pipefail
          test -f .rama14-cli/apply.py || exit 0
          python3 .rama14-cli/apply.py
          rm -rf .rama14-cli
          gofmt -w cmd/orgctl/main.go cmd/orgctl/decision.go
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(decisiongraph): wire explicit orgctl commands"
          git push origin HEAD:feat/14-durable-decision-graph

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install CI tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Download and verify modules
        run: go mod download && go mod verify
      - name: Branch 14 canonical immutability
        run: |
          base=3584d9e7a2e44bbe9d953556704df5e84afd8cf3
          mapfile -t changed < <(git diff --name-only "$base"...HEAD -- docs/canonical | sort -u)
          if [[ ${#changed[@]} -gt 0 ]]; then
            printf 'unauthorized canonical change: %s\n' "${changed[@]}" >&2
            exit 1
          fi
      - name: Git whitespace validation
        run: git diff --check 3584d9e7a2e44bbe9d953556704df5e84afd8cf3...HEAD
      - name: Full non-integration verification
        run: make verify
      - name: Context engine race tests
        run: go test -race -short ./internal/contextengine/...
      - name: Model runtime race tests
        run: go test -race -short ./internal/modelruntime/...
      - name: Model egress race tests
        run: go test -race -short ./internal/modelegress/...
      - name: Model dispatch race tests
        run: go test -race -short ./internal/modeldispatch/...
      - name: Model identity race tests
        run: go test -race -short ./internal/modelidentity/... ./internal/secrets/...
      - name: OpenAI-compatible provider race tests
        run: go test -race -short ./internal/modelruntime/adapter/openaicompat/... ./internal/secrets/...
      - name: Persistent cell worker race tests
        run: go test -race -short ./internal/cellworker/...
      - name: Durable decision graph race tests
        run: go test -race -short ./internal/decisiongraph/...
      - name: Cross builds
        run: make build-cross
      - name: Validate canonical registry
        run: make registry-validate
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Multi-architecture Docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly

  postgres-final-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install CI tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Download and verify modules
        run: go mod download && go mod verify
      - name: Branch 14 canonical immutability
        run: |
          base=3584d9e7a2e44bbe9d953556704df5e84afd8cf3
          mapfile -t changed < <(git diff --name-only "$base"...HEAD -- docs/canonical | sort -u)
          if [[ ${#changed[@]} -gt 0 ]]; then
            printf 'unauthorized canonical change: %s\n' "${changed[@]}" >&2
            exit 1
          fi
      - name: PostgreSQL 17 complete integration suite and CLI smoke tests
        run: make test-integration
      - name: Model egress PostgreSQL 17 integration
        run: make test-model-egress-integration
      - name: Model runtime PostgreSQL 17 integration
        run: make test-model-runtime-integration
      - name: Model dispatch PostgreSQL 17 integration
        run: make test-model-dispatch-integration
      - name: Model identity PostgreSQL 17 integration
        run: make test-model-identity-integration
      - name: Context engine PostgreSQL 17 integration
        run: make test-context-integration
      - name: Authorization PostgreSQL 17 integration
        run: make test-authorization-integration
      - name: Persistent cell worker PostgreSQL 17 integration
        run: make test-cellworker-integration
      - name: Durable decision graph PostgreSQL 17 integration
        run: make test-decisiongraph-integration
      - name: Staging PostgreSQL 17 and real Git integration
        run: make test-staging-integration
      - name: Exact aggregate verification
        run: make verify-all
