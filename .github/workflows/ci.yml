name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download and verify modules
        run: go mod download && go mod verify
      - name: Canonical documents unchanged from Branch 04 base
        run: git diff --exit-code de5ac792cb67489b9f35e3b52cbec9ca8f63c7c7 -- docs/canonical
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -short ./...
      - name: Durable task fitness checks
        run: make test-task-fitness
      - name: Staging security fitness checks
        run: make test-staging-fitness
      - name: Validate canonical registry
        run: go run ./cmd/orgctl registry validate
      - name: Native build
        run: go build ./...
      - name: Cross builds
        run: make build-cross
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Multi-architecture Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: explorarte_test
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: explorarte_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U explorarte_test -d explorarte_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ORG_TEST_DATABASE_URL: postgres://explorarte_test:integration-only-password@127.0.0.1:5432/explorarte_test?sslmode=disable
      ORG_DATABASE_URL: postgres://explorarte_test:integration-only-password@127.0.0.1:5432/explorarte_test?sslmode=disable
      ORG_CANONICAL_DIR: docs/canonical
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download and verify modules
        run: go mod download && go mod verify
      - name: Platform PostgreSQL integration
        run: go test -count=1 -tags=integration ./internal/platform/postgres
      - name: Organization registry integration
        run: go test -count=1 -tags=integration ./internal/organization/registry
      - name: Durable task engine integration
        run: go test -count=1 -tags=integration ./internal/tasks/postgres
      - name: Staging and promotion integration with real Git
        run: go test -count=1 -tags=integration ./internal/staging/postgres
      - name: Registry and task CLI smoke test
        run: |
          go run ./cmd/orgctl migrate up
          go run ./cmd/orgctl registry validate
          set +e
          go run ./cmd/orgctl registry diff
          test $? -eq 3
          set -e
          go run ./cmd/orgctl registry sync --apply
          go run ./cmd/orgctl registry sync --apply
          go run ./cmd/orgctl registry status --json
          go run ./cmd/orgctl registry get-role ingenieria_ia/orquestador --json
          go run ./cmd/orgctl registry get-leader ingenieria_ia --json
          cat > /tmp/task.json <<'JSON'
          {"assigned_role_id":"ingenieria_ia/qa","idempotency_key":"ci-cli-smoke-1","title":"CI task smoke","instructions":"Validate durable task CLI wiring.","acceptance_criteria":["task persists"]}
          JSON
          go run ./cmd/orgctl task create --file /tmp/task.json --actor-id github-actions --json
          go run ./cmd/orgctl task list --status ready --json
          go run ./cmd/orgctl task reconcile --batch 100 --json
          go run ./cmd/orgctl outbox status --json
