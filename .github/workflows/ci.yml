name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install CI tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Download and verify modules
        run: go mod download && go mod verify
      - name: Canonical documents unchanged from Branch 04 base
        run: git diff --exit-code de5ac792cb67489b9f35e3b52cbec9ca8f63c7c7 -- docs/canonical
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -short ./...
      - name: Durable task fitness checks
        run: make test-task-fitness
      - name: Staging security fitness checks
        run: make test-staging-fitness
      - name: Authorization policy fitness checks
        run: make test-authorization-fitness
      - name: Validate canonical registry
        run: go run ./cmd/orgctl registry validate
      - name: Native build
        run: go build ./...
      - name: Cross builds
        run: make build-cross
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Multi-architecture Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: explorarte_test
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: explorarte_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U explorarte_test -d explorarte_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ORG_TEST_DATABASE_URL: postgres://explorarte_test:integration-only-password@127.0.0.1:5432/explorarte_test?sslmode=disable
      ORG_DATABASE_URL: postgres://explorarte_test:integration-only-password@127.0.0.1:5432/explorarte_test?sslmode=disable
      ORG_CANONICAL_DIR: docs/canonical
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download and verify modules
        run: go mod download && go mod verify
      - name: Platform PostgreSQL integration
        run: go test -count=1 -tags=integration ./internal/platform/postgres
      - name: Organization registry integration
        run: go test -count=1 -tags=integration ./internal/organization/registry
      - name: Durable task engine integration
        run: go test -count=1 -tags=integration ./internal/tasks/postgres
      - name: Staging and promotion integration with real Git
        run: go test -count=1 -tags=integration ./internal/staging/postgres
      - name: Capability authorization integration
        run: go test -count=1 -tags=integration ./internal/authorization/postgres
      - name: Registry, task, and authorization CLI smoke test
        run: |
          go run ./cmd/orgctl migrate up
          go run ./cmd/orgctl registry validate
          set +e
          go run ./cmd/orgctl registry diff
          test $? -eq 3
          set -e
          go run ./cmd/orgctl registry sync --apply
          go run ./cmd/orgctl registry sync --apply
          go run ./cmd/orgctl registry status --json
          go run ./cmd/orgctl registry get-role ingenieria_ia/orquestador --json
          go run ./cmd/orgctl registry get-leader ingenieria_ia --json
          cat > /tmp/task.json <<'JSON'
          {"assigned_role_id":"ingenieria_ia/qa","idempotency_key":"ci-cli-smoke-1","title":"CI task smoke","instructions":"Validate durable task CLI wiring.","acceptance_criteria":["task persists"]}
          JSON
          go run ./cmd/orgctl task create --file /tmp/task.json --actor-id github-actions --json
          go run ./cmd/orgctl task list --status ready --json
          go run ./cmd/orgctl task reconcile --batch 100 --json
          go run ./cmd/orgctl outbox status --json
          action_digest="$(printf %s authorization-ci-smoke | sha256sum | cut -d' ' -f1)"
          go run ./cmd/orgctl authorization evaluate --actor-role ingenieria_ia/code-runner --capability code.commit --resource-type code --resource-id ci-smoke --action-digest "$action_digest" --json
          go run ./cmd/orgctl authorization request --actor-role creativo/copywriter --capability rag.publish_approved --resource-type rag_candidate --resource-id ci-smoke --action-digest "$action_digest" --idempotency-key github-actions-authorization-smoke --reason "CI one-time approval" --json >/tmp/authorization-request.json
          request_id="$(grep -m1 '"id"' /tmp/authorization-request.json | tr -cd '0-9')"
          go run ./cmd/orgctl authorization decide "$request_id" --decision approve --actor-role empresa/human --reason "CI owner approval" --json
          go run ./cmd/orgctl authorization consume "$request_id" --actor-role creativo/copywriter --action-digest "$action_digest" --json

  apply-context-engine:
    if: ${{ github.actor != 'github-actions[bot]' && ((github.event_name == 'push' && github.ref_name == 'feat/07-context-engine') || (github.event_name == 'pull_request' && github.head_ref == 'feat/07-context-engine')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: explorarte_test
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: explorarte_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U explorarte_test -d explorarte_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ORG_TEST_DATABASE_URL: postgres://explorarte_test:integration-only-password@127.0.0.1:5432/explorarte_test?sslmode=disable
      ORG_DATABASE_URL: postgres://explorarte_test:integration-only-password@127.0.0.1:5432/explorarte_test?sslmode=disable
      ORG_CANONICAL_DIR: docs/canonical
      CONTEXT_BASE_SHA: bfe21f34d1da3f2d51eb520c4deef635c7f49cab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/07-context-engine
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep xz-utils
      - name: Apply transfer payload
        run: |
          set -euo pipefail
          test -f .github/context-engine.patch.xz.b64
          base64 -d .github/context-engine.patch.xz.b64 | xz -d > /tmp/context-engine.patch
          test "$(sha256sum /tmp/context-engine.patch | cut -d' ' -f1)" = "855c6ecc23cd5f941349b2bb4b41ea6b651d073f9fb4b54817fca5a9fccbb296"
          git apply --check /tmp/context-engine.patch
          git apply /tmp/context-engine.patch
          rm .github/context-engine.patch.xz.b64
          rm -f .github/workflows/context-engine-bootstrap.yml
          gofmt -w cmd/orgctl internal/config internal/contextengine
          git diff --check
          git diff --exit-code "$CONTEXT_BASE_SHA" -- docs/canonical
      - name: Validate implementation
        run: |
          set -euo pipefail
          go test -short ./...
          go test -race -short ./internal/contextengine/...
          make test-context-fitness
          make test-authorization-fitness
          make test-task-fitness
          make test-staging-fitness
          make build-cross
          make registry-validate
          make test-context-integration
          make test-authorization-integration
          make test-staging-integration
      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml Makefile cmd/orgctl internal/config internal/contextengine migrations scripts docs/implementation/branch-07-context-engine
          git diff --cached --name-only | grep '^docs/canonical/' && exit 1 || true
          git commit -m "feat(context): implement deterministic context engine (WIP)"
          git push origin HEAD:feat/07-context-engine
