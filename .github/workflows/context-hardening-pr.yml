name: context-hardening-pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/07-context-engine
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply validation hardening
        run: |
          set -euo pipefail
          python3 .github/context-hardening.py
          gofmt -w internal/contextengine/service.go internal/contextengine/service_operational_test.go
          git diff --check
          git diff --exit-code bfe21f34d1da3f2d51eb520c4deef635c7f49cab -- docs/canonical
      - name: Validate
        run: |
          set -euo pipefail
          go test -short ./internal/contextengine/...
          go test -race -short ./internal/contextengine/...
          make test-context-fitness
      - name: Commit hardening
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/contextengine/service.go internal/contextengine/service_operational_test.go
          git commit -m "fix(context): preserve operational validation errors"
          git push origin HEAD:feat/07-context-engine
