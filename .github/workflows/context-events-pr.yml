name: context-events-pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement-events:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: explorarte_test
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: explorarte_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U explorarte_test -d explorarte_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ORG_TEST_DATABASE_URL: postgres://explorarte_test:integration-only-password@127.0.0.1:5432/explorarte_test?sslmode=disable
      ORG_DATABASE_URL: postgres://explorarte_test:integration-only-password@127.0.0.1:5432/explorarte_test?sslmode=disable
      ORG_CANONICAL_DIR: docs/canonical
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/07-context-engine
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Apply event implementation
        run: |
          set -euo pipefail
          python3 .github/context-events.py
          gofmt -w internal/contextengine
          git diff --check
          git diff --exit-code bfe21f34d1da3f2d51eb520c4deef635c7f49cab -- docs/canonical
      - name: Validate event implementation
        run: |
          set -euo pipefail
          go test -short ./internal/contextengine/...
          go test -race -short ./internal/contextengine/...
          make test-context-fitness
          make test-context-integration
      - name: Commit events
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/contextengine scripts/check-context-fitness.sh
          git commit -m "feat(context): audit snapshot validation failures"
          git push origin HEAD:feat/07-context-engine
