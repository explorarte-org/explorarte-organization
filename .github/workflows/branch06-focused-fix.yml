name: branch06-focused-fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/06-capability-policy-engine
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/authorization/postgres/integration_test.go')
          text = path.read_text()
          old = '''\t\tdigest := authorization.DigestAction([]byte("expire action"))
          \t\tcreated, err := clockService.RequestApproval(ctx, requestCommand("request-expire", "candidate-expire", digest))
          '''
          new = '''\t\tdigest := authorization.DigestAction([]byte("expire action"))
          \t\tcommand := requestCommand("request-expire", "candidate-expire", digest)
          \t\tcommand.TTL = 0 // Exercise the service default TTL of one minute.
          \t\tcreated, err := clockService.RequestApproval(ctx, command)
          '''
          if old not in text:
              raise SystemExit('expiration test anchor not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('internal/authorization/service.go')
          text = path.read_text()
          old = '''\tif err != nil {
          \t\tif errors.Is(err, ErrApprovalPending) || errors.Is(err, ErrApprovalRejected) || errors.Is(err, ErrApprovalExpired) || errors.Is(err, ErrApprovalConsumed) || errors.Is(err, ErrApprovalCancelled) || errors.Is(err, ErrApprovalScopeMismatch) || errors.Is(err, ErrApprovalPolicyDrift) || errors.Is(err, ErrCapabilityDenied) || errors.Is(err, ErrRoleNotFound) || errors.Is(err, ErrRoleDisabled) || errors.Is(err, ErrRoleRetired) || errors.Is(err, ErrRoleNotExecutable) {
          '''
          new = '''\tif err != nil {
          \t\tif errors.Is(err, ErrRequestNotFound) {
          \t\t\tbase.Effect = EffectApprovalRequired
          \t\t\tbase.ReasonCode = ReasonApprovalMissing
          \t\t\treturn base, nil
          \t\t}
          \t\tif errors.Is(err, ErrApprovalPending) || errors.Is(err, ErrApprovalRejected) || errors.Is(err, ErrApprovalExpired) || errors.Is(err, ErrApprovalConsumed) || errors.Is(err, ErrApprovalCancelled) || errors.Is(err, ErrApprovalScopeMismatch) || errors.Is(err, ErrApprovalPolicyDrift) || errors.Is(err, ErrCapabilityDenied) || errors.Is(err, ErrRoleNotFound) || errors.Is(err, ErrRoleDisabled) || errors.Is(err, ErrRoleRetired) || errors.Is(err, ErrRoleNotExecutable) {
          '''
          if old not in text:
              raise SystemExit('service evaluation anchor not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('internal/authorization/service_test.go')
          text = path.read_text()
          anchor = 'func TestEvaluateConsumesValidApprovalBeforeAllow(t *testing.T) {\n'
          addition = '''func TestEvaluateMissingApprovalRequestRemainsApprovalRequired(t *testing.T) {
          \tservice, store, _ := testService(t)
          \tstore.consumeErr = ErrRequestNotFound
          \tid := int64(999)
          \tgot, err := service.Evaluate(context.Background(), EvaluationRequest{
          \t\tOrganizationID:         "explorarte",
          \t\tOrganizationRevisionID: 7,
          \t\tActorRoleID:            "empresa/human",
          \t\tCapabilityID:           "organization.activate_skill",
          \t\tResourceType:           "skill",
          \t\tResourceID:             "x",
          \t\tActionDigest:           DigestAction([]byte("activate skill x")),
          \t\tApprovalRequestID:      &id,
          \t})
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif got.Effect != EffectApprovalRequired || got.ReasonCode != ReasonApprovalMissing {
          \t\tt.Fatalf("evaluation=%+v", got)
          \t}
          }

          '''
          if anchor not in text:
              raise SystemExit('service test anchor not found')
          path.write_text(text.replace(anchor, addition + anchor, 1))
          PY
          gofmt -w \
            internal/authorization/service.go \
            internal/authorization/service_test.go \
            internal/authorization/postgres/integration_test.go
          git diff --check
          git diff --exit-code fb30a4352697ed9cf1f7ef183285954450d1e71d -- docs/canonical

      - name: Commit focused fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            internal/authorization/service.go \
            internal/authorization/service_test.go \
            internal/authorization/postgres/integration_test.go
          git commit -m 'fix(authorization): correct expiry and missing approvals'
          git push origin HEAD:feat/06-capability-policy-engine
