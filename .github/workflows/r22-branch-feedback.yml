name: r22-branch-feedback

on:
  push:
    branches: ["feat/22-ceo-executive-orchestrator"]

permissions:
  contents: read
  statuses: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download && go mod verify
      - name: Build and focused tests
        id: verify
        continue-on-error: true
        run: |
          gofmt -d internal/executive internal/contextengine/taskprovider internal/modelruntime/result_reader.go internal/modelruntime/postgres/result_reader.go internal/tasks/specific_claim.go internal/tasks/postgres/specific_claim.go > /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff
          go build ./...
          go vet ./...
          go test ./internal/executive/... ./internal/completion/... ./internal/tasks/... ./internal/contextengine/... ./internal/modelruntime/...
      - name: Publish branch compile status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.verify.outcome }}
        run: |
          state=failure
          description="R22 build/vet/focused tests failed"
          if [[ "$OUTCOME" == "success" ]]; then
            state=success
            description="R22 build/vet/focused tests passed"
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"r22/compile\",\"description\":\"$description\"}"
      - name: Fail workflow if verification failed
        if: steps.verify.outcome != 'success'
        run: |
          cat /tmp/gofmt.diff || true
          exit 1
