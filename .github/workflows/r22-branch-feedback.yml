name: r22-branch-feedback

on:
  push:
    branches: ["feat/22-ceo-executive-orchestrator"]

permissions:
  contents: read
  statuses: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download && go mod verify
      - name: Build
        id: build
        continue-on-error: true
        run: go build ./...
      - name: Vet
        id: vet
        continue-on-error: true
        run: go vet ./...
      - name: Focused tests
        id: tests
        continue-on-error: true
        run: go test ./internal/executive/... ./internal/completion/... ./internal/tasks/... ./internal/contextengine/... ./internal/modelruntime/...
      - name: Formatting
        id: formatting
        continue-on-error: true
        run: |
          gofmt -d internal/executive internal/contextengine/taskprovider internal/modelruntime/result_reader.go internal/modelruntime/postgres/result_reader.go internal/tasks/specific_claim.go internal/tasks/postgres/specific_claim.go > /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff
      - name: Publish branch feedback
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          BUILD: ${{ steps.build.outcome }}
          VET: ${{ steps.vet.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          FORMAT: ${{ steps.formatting.outcome }}
        run: |
          publish() {
            local context="$1" outcome="$2"
            local state=failure
            local description="$context failed"
            if [[ "$outcome" == "success" ]]; then
              state=success
              description="$context passed"
            fi
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/statuses/$SHA" \
              -d "{\"state\":\"$state\",\"context\":\"r22/$context\",\"description\":\"$description\"}"
          }
          publish build "$BUILD"
          publish vet "$VET"
          publish tests "$TESTS"
          publish gofmt "$FORMAT"
      - name: Fail workflow on any verification failure
        if: steps.build.outcome != 'success' || steps.vet.outcome != 'success' || steps.tests.outcome != 'success' || steps.formatting.outcome != 'success'
        run: |
          cat /tmp/gofmt.diff 2>/dev/null || true
          exit 1
