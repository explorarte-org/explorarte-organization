name: Finalize Capa 14 migration wiring

on:
  push:
    branches: [feat/14-durable-decision-graph]
    paths:
      - ".rama14-finalize/**"
      - ".github/workflows/finalize-capa14.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-capa14-migration-wiring
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply migration test updates
        run: |
          set -euo pipefail
          python3 .rama14-finalize/apply.py
          rm -rf .rama14-finalize
          chmod +x scripts/check-decisiongraph-fitness.sh
          gofmt -w internal/platform/postgres/integration_test.go internal/decisiongraph/postgres/integration_test.go
          git diff --check

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Focused verification
        run: |
          go mod download
          go mod verify
          go test -race -short ./internal/decisiongraph/...
          ./scripts/check-decisiongraph-fitness.sh

      - name: Commit finalized wiring
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(decisiongraph): finalize migration 000012 wiring"
          git push origin HEAD:feat/14-durable-decision-graph
