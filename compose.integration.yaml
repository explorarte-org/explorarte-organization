services:
  # R31 incident fix: the integration project must never depend on, or be
  # able to collide with, compose.yaml's 127.0.0.1:5432:5432 host port
  # publish (the BGE-M3 escape hatch). Tests inside this Compose network
  # already reach Postgres via the internal "postgres" DNS name; resetting
  # ports to empty here means this project's postgres container never
  # tries to bind a host port at all, so it can never collide with -- or
  # silently fall back to -- the shared development instance.
  postgres:
    ports: !reset []
    volumes:
      - ./deployments/postgres/init/002-integration-app-superuser.sh:/docker-entrypoint-initdb.d/002-integration-app-superuser.sh:ro

  integration-test:
    image: golang:1.25-bookworm
    working_dir: /src
    # -p 1 is required, not a tuning knob. Several integration packages reset
    # shared state (TRUNCATE, DROP SCHEMA, migration DownSQL) against the one
    # disposable database this project provides. Go's default builds and runs
    # packages concurrently, so without it those resets interleave and produce
    # failures that look like defects -- deadlocks, missing revisions, foreign
    # key violations -- in code that is fine. Serializing packages makes a red
    # result mean what it should.
    command: ["go", "test", "-p", "1", "-count=1", "-tags=integration", "./..."]
    environment:
      ORG_TEST_DATABASE_URL: postgres://explorarte_app:integration-app-password@postgres:5432/explorarte_test?sslmode=disable
      ORG_DATABASE_URL: postgres://explorarte_app:integration-app-password@postgres:5432/explorarte_test?sslmode=disable
      # R31 incident fix: internal/testdbguard.RequireDestructive requires
      # this as a second, deliberately-set signal before permitting
      # TRUNCATE/migration-DownSQL, independent of the DSN above. Safe to
      # hardcode here because this compose override only ever targets the
      # isolated, discardable integration postgres instance -- it never
      # ships to compose.yaml or anything shared.
      ORG_TEST_DESTRUCTIVE_DATABASE: ${ORG_TEST_DESTRUCTIVE_DATABASE:-explorarte_test}
      ORG_CANONICAL_DIR: /src/docs/canonical
      ORG_STAGING_ENABLED: "true"
      ORG_STAGING_REPOSITORIES_FILE: /tmp/explorarte-staging/repositories.yaml
      ORG_STAGING_WORKSPACE_ROOT: /tmp/explorarte-staging/workspaces
      ORG_STAGING_ARTIFACT_ROOT: /tmp/explorarte-staging/artifacts
      ORG_STAGING_QUARANTINE_ROOT: /tmp/explorarte-staging/quarantine
      ORG_STAGING_COMMAND_TIMEOUT: 90s
      ORG_STAGING_MAX_ARTIFACT_BYTES: "16777216"
      ORG_STAGING_MAX_CHANGED_FILES: "100"
      ORG_STAGING_STALE_AFTER: 2m
      ORG_STAGING_RECONCILE_INTERVAL: 30s
      ORG_STAGING_RECONCILE_BATCH_SIZE: "100"
      ORG_STAGING_GIT_BINARY: git
      GOCACHE: /cache/go-build
      GOMODCACHE: /cache/go-mod
    volumes:
      - .:/src:ro
      - integration-go-cache:/cache
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - org-internal
    profiles: ["integration"]

# R31 audit fix: no fixed name: overrides here. Compose's default
# behavior namespaces volumes/networks as "<project-name>_<key>" -- fixing
# the name here (as this file used to) silently defeated that namespacing,
# so two worktrees running integration tests concurrently under different
# --project-name values would still share (and each other's cleanup could
# delete) the exact same volume/network. Leaving these as bare declarations
# lets --project-name (see scripts/test-integration.sh, one per
# worker/worktree by default) actually isolate them. Verified by
# scripts/check-parallel-worker-isolation.sh.
volumes:
  # compose.yaml pins a fixed name: for postgres-data at the top level
  # (shared with the production/dev project) -- reset it here so this
  # project gets Compose's normal <project-name>_postgres-data instead of
  # inheriting the production name and colliding with it (or with another
  # worktree's integration project) across --project-name values.
  postgres-data:
    name: !reset null
  integration-go-cache: {}

networks:
  # Same reasoning as postgres-data above -- compose.yaml pins org-internal
  # to a fixed name: at the top level.
  org-internal:
    name: !reset null
