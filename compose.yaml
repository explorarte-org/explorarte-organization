# Canonical Compose project for the production organization. Deployments
# from main rely on this name resolving to the project that actually runs
# in production.
#
# Development and integration worktrees MUST obtain isolation through
# COMPOSE_PROJECT_NAME or --project-name in their own environment, never by
# editing this shared file. A worktree once renamed the project here to
# avoid colliding with production; the change was correct in intent and
# applied in the wrong layer, so once it reached main this file described a
# development worktree instead of the deployment. `docker compose stop` then
# exited 0 while matching nothing, and a `docker compose up` would have
# created a second runtime alongside the live one against the same database.
# scripts/check-parallel-worker-isolation.sh asserts both halves: this name
# stays canonical, and an override still produces separate resources.
name: explorarte-organization

services:
  postgres:
    # R29: pinned by digest, not a floating tag — pgvector/pgvector:pg17 as of
    # this commit is PostgreSQL 17.10 on Debian bookworm (same OS/collation
    # family as the previous postgres:17-bookworm image, confirmed via
    # `docker run --rm pgvector/pgvector:pg17 postgres --version` /
    # /etc/os-release), so it is a safe drop-in for the existing data volume.
    # This image swap alone does not create the extension — see
    # deployments/postgres/RUNBOOK-enable-pgvector.md for the one-time
    # administrative CREATE EXTENSION step required on an existing volume
    # (docker-entrypoint-initdb.d only runs against a brand-new empty volume).
    image: pgvector/pgvector@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
    environment:
      POSTGRES_USER: ${ORG_POSTGRES_ADMIN_USER:?set ORG_POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${ORG_POSTGRES_ADMIN_PASSWORD:?set ORG_POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: ${ORG_POSTGRES_DATABASE:-explorarte_org}
      ORG_POSTGRES_USER: ${ORG_POSTGRES_USER:-explorarte_app}
      ORG_POSTGRES_PASSWORD: ${ORG_POSTGRES_PASSWORD:?set ORG_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deployments/postgres/init/000-enable-pgvector.sh:/docker-entrypoint-initdb.d/000-enable-pgvector.sh:ro
      - ./deployments/postgres/init/001-create-app-user.sh:/docker-entrypoint-initdb.d/001-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    shm_size: 128mb
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # Host-loopback only, for one-off `docker compose run --network host`
      # invocations that need to reach the BGE-M3 sidecar (loopback-only by
      # design, see internal/embeddingruntime/adapter/bgem3) from a
      # container in the same network namespace as the host. The persistent
      # orgd/model-worker services stay on the bridge network and reach
      # postgres via the "postgres" DNS name as before -- this port exists
      # only for that specific escape hatch, not general external access.
      - "127.0.0.1:5432:5432"
    networks:
      - org-internal

  orgd:
    build:
      context: .
      args:
        VERSION: ${ORG_VERSION:-dev}
        COMMIT: ${ORG_COMMIT:-local}
        BUILD_TIME: ${ORG_BUILD_TIME:-unknown}
    image: explorarte-organization:${ORG_VERSION:-dev}
    environment:
      ORG_APP_NAME: ${ORG_APP_NAME:-explorarte-organization}
      ORG_ENVIRONMENT: ${ORG_ENVIRONMENT:-development}
      ORG_HTTP_ADDR: :8080
      ORG_HTTP_READ_HEADER_TIMEOUT: ${ORG_HTTP_READ_HEADER_TIMEOUT:-5s}
      ORG_HTTP_READ_TIMEOUT: ${ORG_HTTP_READ_TIMEOUT:-15s}
      ORG_HTTP_WRITE_TIMEOUT: ${ORG_HTTP_WRITE_TIMEOUT:-30s}
      ORG_HTTP_IDLE_TIMEOUT: ${ORG_HTTP_IDLE_TIMEOUT:-60s}
      ORG_SHUTDOWN_TIMEOUT: ${ORG_SHUTDOWN_TIMEOUT:-15s}
      ORG_LOG_LEVEL: ${ORG_LOG_LEVEL:-info}
      ORG_LOG_FORMAT: ${ORG_LOG_FORMAT:-json}
      ORG_DATABASE_HOST: postgres
      ORG_DATABASE_PORT: 5432
      ORG_DATABASE_NAME: ${ORG_POSTGRES_DATABASE:-explorarte_org}
      ORG_DATABASE_USER: ${ORG_POSTGRES_USER:-explorarte_app}
      ORG_DATABASE_PASSWORD: ${ORG_POSTGRES_PASSWORD:?set ORG_POSTGRES_PASSWORD in .env}
      ORG_DATABASE_SSLMODE: disable
      ORG_DATABASE_MAX_CONNS: ${ORG_DATABASE_MAX_CONNS:-8}
      ORG_DATABASE_MIN_CONNS: ${ORG_DATABASE_MIN_CONNS:-1}
      ORG_DATABASE_MAX_CONN_LIFETIME: ${ORG_DATABASE_MAX_CONN_LIFETIME:-30m}
      ORG_DATABASE_MAX_CONN_IDLE_TIME: ${ORG_DATABASE_MAX_CONN_IDLE_TIME:-5m}
      ORG_DATABASE_HEALTH_CHECK_PERIOD: ${ORG_DATABASE_HEALTH_CHECK_PERIOD:-30s}
      ORG_DATABASE_CONNECT_TIMEOUT: ${ORG_DATABASE_CONNECT_TIMEOUT:-5s}
      ORG_DATABASE_PING_TIMEOUT: ${ORG_DATABASE_PING_TIMEOUT:-2s}
      ORG_DATABASE_STATEMENT_TIMEOUT: ${ORG_DATABASE_STATEMENT_TIMEOUT:-30s}
      ORG_DATABASE_LOCK_TIMEOUT: ${ORG_DATABASE_LOCK_TIMEOUT:-5s}
      ORG_DATABASE_AUTO_MIGRATE: ${ORG_DATABASE_AUTO_MIGRATE:-false}
      ORG_DATABASE_MIGRATION_TIMEOUT: ${ORG_DATABASE_MIGRATION_TIMEOUT:-45s}
      ORG_DATABASE_MIGRATION_RETRY: ${ORG_DATABASE_MIGRATION_RETRY:-5s}
      ORG_CANONICAL_DIR: /opt/explorarte/docs/canonical
      ORG_REGISTRY_SYNC_TIMEOUT: ${ORG_REGISTRY_SYNC_TIMEOUT:-30s}
      ORG_TASK_ORGANIZATION_ID: ${ORG_TASK_ORGANIZATION_ID:-explorarte}
      ORG_TASK_RECONCILER_ENABLED: ${ORG_TASK_RECONCILER_ENABLED:-true}
      ORG_TASK_RECONCILE_INTERVAL: ${ORG_TASK_RECONCILE_INTERVAL:-5s}
      ORG_TASK_RECONCILE_BATCH_SIZE: ${ORG_TASK_RECONCILE_BATCH_SIZE:-100}
      ORG_TASK_DEFAULT_MAX_ATTEMPTS: ${ORG_TASK_DEFAULT_MAX_ATTEMPTS:-5}
      ORG_TASK_DEFAULT_LEASE_DURATION: ${ORG_TASK_DEFAULT_LEASE_DURATION:-2m}
      ORG_TASK_MAX_LEASE_DURATION: ${ORG_TASK_MAX_LEASE_DURATION:-15m}
      ORG_TASK_RETRY_BASE_DELAY: ${ORG_TASK_RETRY_BASE_DELAY:-5s}
      ORG_TASK_RETRY_MAX_DELAY: ${ORG_TASK_RETRY_MAX_DELAY:-10m}
      ORG_TASK_OUTBOX_MAX_ATTEMPTS: ${ORG_TASK_OUTBOX_MAX_ATTEMPTS:-10}
      ORG_TASK_OUTBOX_CLAIM_DURATION: ${ORG_TASK_OUTBOX_CLAIM_DURATION:-1m}
      ORG_TASK_COMMAND_TIMEOUT: ${ORG_TASK_COMMAND_TIMEOUT:-30s}
      ORG_STAGING_ENABLED: ${ORG_STAGING_ENABLED:-false}
      ORG_STAGING_REPOSITORIES_FILE: ${ORG_STAGING_REPOSITORIES_FILE:-/etc/explorarte/repositories.yaml}
      ORG_STAGING_WORKSPACE_ROOT: ${ORG_STAGING_WORKSPACE_ROOT:-/var/lib/explorarte/staging/workspaces}
      ORG_STAGING_ARTIFACT_ROOT: ${ORG_STAGING_ARTIFACT_ROOT:-/var/lib/explorarte/staging/artifacts}
      ORG_STAGING_QUARANTINE_ROOT: ${ORG_STAGING_QUARANTINE_ROOT:-/var/lib/explorarte/staging/quarantine}
      ORG_STAGING_COMMAND_TIMEOUT: ${ORG_STAGING_COMMAND_TIMEOUT:-2m}
      # R17-001: internal/executive/bootstrap/missionprovisioning.go's
      # missionProvisioningOptions silently returns (nil, nil) -- no
      # mission provisioning at all, not an error -- when either of these
      # two is unset, even with staging fully enabled. Found live: orgd
      # had every ORG_STAGING_* var above but neither of these, so the
      # design-freeze -> EngineeringMission -> CodeRunner handoff could
      # never fire in this deployment regardless of staging's own state.
      # Values matched to code-runner's own block below on purpose --
      # see that block's comment on why the Executive that bases a
      # mission on a ref and the worker that later promotes onto it must
      # read the same ref.
      ORG_CODE_RUNNER_REPOSITORY_ID: explorarte-organization
      ORG_CODE_RUNNER_TARGET_REF: refs/heads/main
      ORG_STAGING_MAX_ARTIFACT_BYTES: ${ORG_STAGING_MAX_ARTIFACT_BYTES:-67108864}
      ORG_STAGING_MAX_CHANGED_FILES: ${ORG_STAGING_MAX_CHANGED_FILES:-500}
      ORG_STAGING_STALE_AFTER: ${ORG_STAGING_STALE_AFTER:-30m}
      ORG_STAGING_RECONCILE_INTERVAL: ${ORG_STAGING_RECONCILE_INTERVAL:-30s}
      ORG_STAGING_RECONCILE_BATCH_SIZE: ${ORG_STAGING_RECONCILE_BATCH_SIZE:-100}
      ORG_STAGING_GIT_BINARY: ${ORG_STAGING_GIT_BINARY:-git}
      # OCI Object Storage (see model-worker for the fuller explanation) --
      # mounted here too because the objectstorage CLI subcommands run via
      # `docker compose run --rm --entrypoint orgctl orgd objectstorage ...`.
      ORG_OBJECT_STORAGE_OCI_ENABLED: "true"
      ORG_OBJECT_STORAGE_OCI_TENANCY_OCID: ocid1.tenancy.oc1..aaaaaaaa4fugjamty3gtjrjmdmmfomlivxabqpqsgprlxkhz6lebjgutumzq
      ORG_OBJECT_STORAGE_OCI_USER_OCID: ocid1.user.oc1..aaaaaaaagdrjnpcecaqx7dzybkdvn5fvdelcm7a7fhrskywitssx5q74ezta
      ORG_OBJECT_STORAGE_OCI_FINGERPRINT: "0b:a6:4b:35:a0:b2:19:73:ae:04:75:ca:17:dc:6c:ad"
      ORG_OBJECT_STORAGE_OCI_REGION: sa-santiago-1
      ORG_OBJECT_STORAGE_OCI_NAMESPACE: axkhdnwe6r1c
      ORG_OBJECT_STORAGE_OCI_BUCKET: bucket-20260810-0027
      ORG_OBJECT_STORAGE_OCI_PRIVATE_KEY_FILE: /run/secrets/oci-object-storage-api-key.pem
      # Gemini Embedding 2 -- billed, real API, used for multimodal (PDF page)
      # and text chunk embeddings via internal/embeddingruntime/adapter/gemini.
      ORG_EMBEDDING_PROVIDER_GEMINI_ENABLED: "true"
      ORG_EMBEDDING_PROVIDER_GEMINI_BASE_URL: https://generativelanguage.googleapis.com
      ORG_EMBEDDING_PROVIDER_GEMINI_CREDENTIAL_FILE: /run/secrets/gemini-embedding-api-key
    ports:
      - "127.0.0.1:${ORG_HTTP_PORT:-8080}:8080"
    volumes:
      - /etc/explorarte/secrets/oci-object-storage-api-key.pem:/run/secrets/oci-object-storage-api-key.pem:ro
      - /home/ubuntu/rag_curado:/opt/explorarte/knowledge-source/rag_curado:ro
      - /etc/explorarte/secrets/gemini-embedding-api-key:/run/secrets/gemini-embedding-api-key:ro
      # Staging roots: orgd's own reconciler (internal/app/app.go, gated on
      # cfg.Staging.Enabled) needs these mounted too, not just code-runner --
      # found live, first real deploy with staging enabled: orgd logged
      # "staging initialization failed... readiness is blocked" (fails soft,
      # HTTP health stays live) because /var/lib/explorarte wasn't mounted at
      # all here and orgd's read_only root filesystem refused the mkdir.
      - /etc/explorarte/repositories.yaml:/etc/explorarte/repositories.yaml:ro
      - /var/lib/explorarte/staging/repo/explorarte-organization:/var/lib/explorarte/staging/repo/explorarte-organization
      - /var/lib/explorarte/staging/workspaces:/var/lib/explorarte/staging/workspaces
      - /var/lib/explorarte/staging/artifacts:/var/lib/explorarte/staging/artifacts
      - /var/lib/explorarte/staging/quarantine:/var/lib/explorarte/staging/quarantine
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "/usr/local/bin/orgctl", "health", "--ready", "--url", "http://127.0.0.1:8080"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - org-internal

  model-worker:
    # orgctl model worker run: the only process that consumes
    # ORG_MODEL_EXECUTION_IDENTITY_* / dispatches real invocations (orgd
    # never imports internal/modelruntime -- see
    # cmd/orgctl/worker.go:runModelWorker doc comment). Same image as orgd,
    # different entrypoint. Runs the full internal/config.Config the same
    # way orgd does (openModelWorkerRuntime calls config.Load()), so it
    # needs the same database/canonical/task/staging environment -- not
    # because this process reads all of it, but because config.Load()
    # validates the whole struct at once.
    image: explorarte-organization:${ORG_VERSION:-dev}
    entrypoint: ["/usr/local/bin/orgctl", "model", "worker", "run"]
    environment:
      ORG_APP_NAME: ${ORG_APP_NAME:-explorarte-organization}
      ORG_ENVIRONMENT: ${ORG_ENVIRONMENT:-development}
      ORG_LOG_LEVEL: ${ORG_LOG_LEVEL:-info}
      ORG_LOG_FORMAT: ${ORG_LOG_FORMAT:-json}
      ORG_DATABASE_HOST: postgres
      ORG_DATABASE_PORT: 5432
      ORG_DATABASE_NAME: ${ORG_POSTGRES_DATABASE:-explorarte_org}
      ORG_DATABASE_USER: ${ORG_POSTGRES_USER:-explorarte_app}
      ORG_DATABASE_PASSWORD: ${ORG_POSTGRES_PASSWORD:?set ORG_POSTGRES_PASSWORD in .env}
      ORG_DATABASE_SSLMODE: disable
      ORG_DATABASE_MAX_CONNS: ${ORG_DATABASE_MAX_CONNS:-8}
      ORG_DATABASE_MIN_CONNS: ${ORG_DATABASE_MIN_CONNS:-1}
      ORG_DATABASE_MAX_CONN_LIFETIME: ${ORG_DATABASE_MAX_CONN_LIFETIME:-30m}
      ORG_DATABASE_MAX_CONN_IDLE_TIME: ${ORG_DATABASE_MAX_CONN_IDLE_TIME:-5m}
      ORG_DATABASE_HEALTH_CHECK_PERIOD: ${ORG_DATABASE_HEALTH_CHECK_PERIOD:-30s}
      ORG_DATABASE_CONNECT_TIMEOUT: ${ORG_DATABASE_CONNECT_TIMEOUT:-5s}
      ORG_DATABASE_PING_TIMEOUT: ${ORG_DATABASE_PING_TIMEOUT:-2s}
      ORG_DATABASE_STATEMENT_TIMEOUT: ${ORG_DATABASE_STATEMENT_TIMEOUT:-30s}
      ORG_DATABASE_LOCK_TIMEOUT: ${ORG_DATABASE_LOCK_TIMEOUT:-5s}
      ORG_DATABASE_AUTO_MIGRATE: ${ORG_DATABASE_AUTO_MIGRATE:-false}
      ORG_DATABASE_MIGRATION_TIMEOUT: ${ORG_DATABASE_MIGRATION_TIMEOUT:-45s}
      ORG_DATABASE_MIGRATION_RETRY: ${ORG_DATABASE_MIGRATION_RETRY:-5s}
      ORG_CANONICAL_DIR: /opt/explorarte/docs/canonical
      ORG_REGISTRY_SYNC_TIMEOUT: ${ORG_REGISTRY_SYNC_TIMEOUT:-30s}
      ORG_TASK_ORGANIZATION_ID: ${ORG_TASK_ORGANIZATION_ID:-explorarte}
      ORG_TASK_RECONCILER_ENABLED: ${ORG_TASK_RECONCILER_ENABLED:-true}
      ORG_TASK_RECONCILE_INTERVAL: ${ORG_TASK_RECONCILE_INTERVAL:-5s}
      ORG_TASK_RECONCILE_BATCH_SIZE: ${ORG_TASK_RECONCILE_BATCH_SIZE:-100}
      ORG_TASK_DEFAULT_MAX_ATTEMPTS: ${ORG_TASK_DEFAULT_MAX_ATTEMPTS:-5}
      ORG_TASK_DEFAULT_LEASE_DURATION: ${ORG_TASK_DEFAULT_LEASE_DURATION:-2m}
      ORG_TASK_MAX_LEASE_DURATION: ${ORG_TASK_MAX_LEASE_DURATION:-15m}
      ORG_TASK_RETRY_BASE_DELAY: ${ORG_TASK_RETRY_BASE_DELAY:-5s}
      ORG_TASK_RETRY_MAX_DELAY: ${ORG_TASK_RETRY_MAX_DELAY:-10m}
      ORG_TASK_OUTBOX_MAX_ATTEMPTS: ${ORG_TASK_OUTBOX_MAX_ATTEMPTS:-10}
      ORG_TASK_OUTBOX_CLAIM_DURATION: ${ORG_TASK_OUTBOX_CLAIM_DURATION:-1m}
      ORG_TASK_COMMAND_TIMEOUT: ${ORG_TASK_COMMAND_TIMEOUT:-30s}
      ORG_STAGING_ENABLED: ${ORG_STAGING_ENABLED:-false}
      ORG_STAGING_REPOSITORIES_FILE: ${ORG_STAGING_REPOSITORIES_FILE:-/etc/explorarte/repositories.yaml}
      ORG_STAGING_WORKSPACE_ROOT: ${ORG_STAGING_WORKSPACE_ROOT:-/var/lib/explorarte/staging/workspaces}
      ORG_STAGING_ARTIFACT_ROOT: ${ORG_STAGING_ARTIFACT_ROOT:-/var/lib/explorarte/staging/artifacts}
      ORG_STAGING_QUARANTINE_ROOT: ${ORG_STAGING_QUARANTINE_ROOT:-/var/lib/explorarte/staging/quarantine}
      ORG_STAGING_COMMAND_TIMEOUT: ${ORG_STAGING_COMMAND_TIMEOUT:-2m}
      ORG_STAGING_MAX_ARTIFACT_BYTES: ${ORG_STAGING_MAX_ARTIFACT_BYTES:-67108864}
      ORG_STAGING_MAX_CHANGED_FILES: ${ORG_STAGING_MAX_CHANGED_FILES:-500}
      ORG_STAGING_STALE_AFTER: ${ORG_STAGING_STALE_AFTER:-30m}
      ORG_STAGING_RECONCILE_INTERVAL: ${ORG_STAGING_RECONCILE_INTERVAL:-30s}
      ORG_STAGING_RECONCILE_BATCH_SIZE: ${ORG_STAGING_RECONCILE_BATCH_SIZE:-100}
      ORG_STAGING_GIT_BINARY: ${ORG_STAGING_GIT_BINARY:-git}
      # SELF-AUDIT-001 (2026-09-02): internal/executive/bootstrap/
      # repositoryevidence.go's repositoryEvidenceOption reads this SAME
      # env var (missionRepositoryEnv) and silently returns no repository
      # evidence source at all -- no error, no log -- when it is unset,
      # exactly like missionProvisioningOptions (R17-001). orgd got this
      # fix; model-worker did not, even though `executive submit`/`resume`
      # are actually run against THIS service in practice (orgd has no
      # ORG_MODEL_EXECUTION_PRINCIPAL_KEY). Found live: a real self-audit
      # worker task asked to review internal/coderunner/ and
      # internal/engineeringmission/ had zero source code in its context
      # and honestly reported "no source code provided" -- not a model
      # failure, a missing evidence source.
      ORG_CODE_RUNNER_REPOSITORY_ID: explorarte-organization
      ORG_CODE_RUNNER_TARGET_REF: refs/heads/main
      ORG_MODEL_RUNTIME_ENABLED: "true"
      ORG_MODEL_EXECUTION_IDENTITY_ENABLED: "true"
      ORG_MODEL_EXECUTION_IDENTITY_KEY_FILE: /run/secrets/model-execution-identity.pem
      ORG_MODEL_EXECUTION_PRINCIPAL_KEY: oracle-org-01/model-runtime-01
      ORG_MODEL_WORKER_BATCH_SIZE: ${ORG_MODEL_WORKER_BATCH_SIZE:-10}
      ORG_MODEL_WORKER_CONCURRENCY: ${ORG_MODEL_WORKER_CONCURRENCY:-1}
      # DeepSeek: official OpenAI-compatible Chat Completions interface,
      # confirmed against DeepSeek's own docs (base https://api.deepseek.com,
      # POST /chat/completions -- stateless, full history resent each turn).
      ORG_MODEL_PROVIDER_DEEPSEEK_ENABLED: "true"
      ORG_MODEL_PROVIDER_DEEPSEEK_ENDPOINT_URL: https://api.deepseek.com/chat/completions
      ORG_MODEL_PROVIDER_DEEPSEEK_CREDENTIAL_FILE: /run/secrets/deepseek-api-key
      # Default request timeout (2m) proved too short for larger curation
      # clusters needing several thousand output tokens (owner-directed
      # corpus curation canary, found live: response_read_failed on
      # anything beyond a 2-work cluster). Bumped to give real generation
      # time headroom -- an infra/timeout fix, not a prompt/schema/
      # threshold change, so it does not violate the canary's frozen-
      # config rule.
      ORG_MODEL_PROVIDER_DEEPSEEK_REQUEST_TIMEOUT: 10m
      # Real root cause of every response_read_failed in the canary run:
      # ORG_MODEL_RUNTIME_COMMAND_TIMEOUT defaults to 30s and wraps the
      # ENTIRE 'orgctl model invocation dispatch' command, including the
      # provider HTTP call -- Go context.WithTimeout nests to the MINIMUM
      # of parent and child deadlines, so this 30s outer deadline was
      # firing before the DeepSeek adapter's own 6m/10m RequestTimeout
      # ever had a chance to matter. Every canary failure died at ~30.8s
      # regardless of cluster size or max_output_tokens. Infra/timeout
      # fix only, does not touch prompt/schema/rubric/threshold.
      ORG_MODEL_RUNTIME_COMMAND_TIMEOUT: 10m
      # OpenAI-compatible: credential mounted and ready, but left disabled.
      # The current adapter (internal/modelruntime/adapter/openaicompat)
      # only speaks Chat Completions (AdapterID=openai_chat_completions,
      # schema openai.chat.completions.request.v1). gpt-5.6-luna is meant to
      # run over the Responses API (/v1/responses +
      # /v1/responses/compact for native compaction) per owner decision --
      # that needs a new adapter/protocol, not just this env wiring, so it
      # stays disabled until that code exists.
      # OpenAI-compatible: enabled via Chat Completions (the adapter's only
      # supported shape today). gpt-5.6-luna is documented to prefer
      # Responses API (/v1/responses + native /v1/responses/compact) for
      # agentic/multi-turn work -- that adapter does not exist yet, this is
      # the interim path while it is built.
      ORG_MODEL_PROVIDER_OPENAI_COMPATIBLE_ENABLED: "true"
      ORG_MODEL_PROVIDER_OPENAI_COMPATIBLE_ENDPOINT_URL: https://api.openai.com/v1/chat/completions
      ORG_MODEL_PROVIDER_OPENAI_COMPATIBLE_CREDENTIAL_FILE: /run/secrets/openai-compatible-api-key
      # OpenAI Responses API: new adapter (internal/modelruntime/adapter/openairesponses),
      # built and tested but not yet wired into model-routing.yaml. Enabled here only for a
      # manual latency canary; reuses the existing openai-compatible-api-key secret (same
      # OpenAI account/credential works for both Chat Completions and Responses endpoints).
      ORG_MODEL_PROVIDER_OPENAI_RESPONSES_ENABLED: "true"
      ORG_MODEL_PROVIDER_OPENAI_RESPONSES_ENDPOINT_URL: https://api.openai.com/v1/responses
      ORG_MODEL_PROVIDER_OPENAI_RESPONSES_CREDENTIAL_FILE: /run/secrets/openai-compatible-api-key
      # Gemini chat completions (department.leader/department.worker routing,
      # owner_conversation_r17v8/r17v11_gemini_worker_migration): this service is
      # the ONLY one that actually dispatches model calls, and this block was never
      # added here when gemini was migrated to -- the adapter compiled and the
      # routing pointed at it, but model-worker itself had no credential to ever
      # reach it, so every real department.leader/worker dispatch failed closed
      # with "model provider adapter unavailable" (found live, ORGANIZATION-AUTONOMOUS-
      # TRANSFORM-001's first real campaign). Reuses the same Google API key already
      # mounted for embeddings -- one Google AI Studio key works for both.
      ORG_MODEL_PROVIDER_GEMINI_ENABLED: "true"
      ORG_MODEL_PROVIDER_GEMINI_ENDPOINT_URL: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      ORG_MODEL_PROVIDER_GEMINI_CREDENTIAL_FILE: /run/secrets/gemini-embedding-api-key
      # xAI (research.adversarial_review routing, owner_conversation_grok_adversarial_review_001):
      # same gap as gemini above -- compiled and routed, never actually reachable
      # from the one service that dispatches.
      ORG_MODEL_PROVIDER_XAI_ENABLED: "true"
      ORG_MODEL_PROVIDER_XAI_ENDPOINT_URL: https://api.x.ai/v1/chat/completions
      ORG_MODEL_PROVIDER_XAI_CREDENTIAL_FILE: /run/secrets/grok-api-key
      # OCI Object Storage: source-of-truth bucket for the knowledge ingestion
      # pipeline (raw/normalized/manifests/logs). Hand-rolled OCI Signing v1
      # client (internal/objectstorage), no OCI SDK dependency.
      ORG_OBJECT_STORAGE_OCI_ENABLED: "true"
      ORG_OBJECT_STORAGE_OCI_TENANCY_OCID: ocid1.tenancy.oc1..aaaaaaaa4fugjamty3gtjrjmdmmfomlivxabqpqsgprlxkhz6lebjgutumzq
      ORG_OBJECT_STORAGE_OCI_USER_OCID: ocid1.user.oc1..aaaaaaaagdrjnpcecaqx7dzybkdvn5fvdelcm7a7fhrskywitssx5q74ezta
      ORG_OBJECT_STORAGE_OCI_FINGERPRINT: "0b:a6:4b:35:a0:b2:19:73:ae:04:75:ca:17:dc:6c:ad"
      ORG_OBJECT_STORAGE_OCI_REGION: sa-santiago-1
      ORG_OBJECT_STORAGE_OCI_NAMESPACE: axkhdnwe6r1c
      ORG_OBJECT_STORAGE_OCI_BUCKET: bucket-20260810-0027
      ORG_OBJECT_STORAGE_OCI_PRIVATE_KEY_FILE: /run/secrets/oci-object-storage-api-key.pem
    volumes:
      - /etc/explorarte/secrets/model-execution-identity.pem:/run/secrets/model-execution-identity.pem:ro
      - /etc/explorarte/secrets/deepseek-api-key:/run/secrets/deepseek-api-key:ro
      - /etc/explorarte/secrets/openai-compatible-api-key:/run/secrets/openai-compatible-api-key:ro
      - /etc/explorarte/secrets/gemini-embedding-api-key:/run/secrets/gemini-embedding-api-key:ro
      - /etc/explorarte/secrets/grok-api-key:/run/secrets/grok-api-key:ro
      - /etc/explorarte/secrets/oci-object-storage-api-key.pem:/run/secrets/oci-object-storage-api-key.pem:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Real readiness, not process-liveness-only: model-worker now runs
      # the same internal/platform/httpserver orgd does (cmd/orgctl/
      # worker.go), so this is the identical CMD form orgd's own
      # healthcheck already uses -- not a CMD-SHELL/pgrep check, which
      # could never run at all in this distroless, shell-less image
      # (found live: model-worker reported unhealthy the entire time
      # despite dispatching real, successful model calls -- Wave 5
      # finding, ORGANIZATION-GRAND-AUDIT-001). --ready pings the real
      # database dependency, so this proves more than the pgrep check
      # it replaces, not merely a portable version of it.
      test: ["CMD", "/usr/local/bin/orgctl", "health", "--ready", "--url", "http://127.0.0.1:8080"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      - postgres
    networks:
      - org-internal

  code-runner:
    # orgctl code-runner worker run: the CodeRunner worker loop
    # (internal/coderunner.Worker), the actual code-writing stage this
    # session's audit (G4-005/AUTH-005) found sitting fully dormant --
    # ORG_STAGING_ENABLED was false in production the whole time. Built
    # from the Dockerfile's dedicated 'coderunner' target: a separate,
    # smaller image (plain golang base, not distroless) because this is
    # the one process that needs a real go/git toolchain to actually run
    # GO_BUILD/GO_VET/GO_TEST/GIT_DIFF -- and its own unprivileged system
    # user (coderunner, uid/gid 999, no login shell), distinct from
    # orgd/model-worker's distroless nonroot uid 65532.
    #
    # This worker can NEVER push or open a PR by itself -- confirmed by
    # reading internal/staging/gitexec/backend.go end to end: every git
    # operation it runs is worktree/rev-parse/diff/update-ref, never
    # push. The durable output of a sealed workspace is a stored patch
    # artifact (application/vnd.git.binary-patch); turning that into a
    # real GitHub PR remains a separate, human-reviewed step, exactly
    # like every other PR this session produced.
    image: explorarte-organization-coderunner:${ORG_VERSION:-dev}
    command: ["code-runner", "worker", "run"]
    environment:
      ORG_APP_NAME: ${ORG_APP_NAME:-explorarte-organization}
      ORG_ENVIRONMENT: ${ORG_ENVIRONMENT:-development}
      ORG_LOG_LEVEL: ${ORG_LOG_LEVEL:-info}
      ORG_LOG_FORMAT: ${ORG_LOG_FORMAT:-json}
      ORG_DATABASE_HOST: postgres
      ORG_DATABASE_PORT: 5432
      ORG_DATABASE_NAME: ${ORG_POSTGRES_DATABASE:-explorarte_org}
      ORG_DATABASE_USER: ${ORG_POSTGRES_USER:-explorarte_app}
      ORG_DATABASE_PASSWORD: ${ORG_POSTGRES_PASSWORD:?set ORG_POSTGRES_PASSWORD in .env}
      ORG_DATABASE_SSLMODE: disable
      ORG_DATABASE_MAX_CONNS: ${ORG_DATABASE_MAX_CONNS:-8}
      ORG_DATABASE_MIN_CONNS: ${ORG_DATABASE_MIN_CONNS:-1}
      ORG_DATABASE_MAX_CONN_LIFETIME: ${ORG_DATABASE_MAX_CONN_LIFETIME:-30m}
      ORG_DATABASE_MAX_CONN_IDLE_TIME: ${ORG_DATABASE_MAX_CONN_IDLE_TIME:-5m}
      ORG_DATABASE_HEALTH_CHECK_PERIOD: ${ORG_DATABASE_HEALTH_CHECK_PERIOD:-30s}
      ORG_DATABASE_CONNECT_TIMEOUT: ${ORG_DATABASE_CONNECT_TIMEOUT:-5s}
      ORG_DATABASE_PING_TIMEOUT: ${ORG_DATABASE_PING_TIMEOUT:-2s}
      ORG_DATABASE_STATEMENT_TIMEOUT: ${ORG_DATABASE_STATEMENT_TIMEOUT:-30s}
      ORG_DATABASE_LOCK_TIMEOUT: ${ORG_DATABASE_LOCK_TIMEOUT:-5s}
      ORG_DATABASE_AUTO_MIGRATE: ${ORG_DATABASE_AUTO_MIGRATE:-false}
      ORG_DATABASE_MIGRATION_TIMEOUT: ${ORG_DATABASE_MIGRATION_TIMEOUT:-45s}
      ORG_DATABASE_MIGRATION_RETRY: ${ORG_DATABASE_MIGRATION_RETRY:-5s}
      ORG_CANONICAL_DIR: /opt/explorarte/docs/canonical
      ORG_REGISTRY_SYNC_TIMEOUT: ${ORG_REGISTRY_SYNC_TIMEOUT:-30s}
      ORG_TASK_ORGANIZATION_ID: ${ORG_TASK_ORGANIZATION_ID:-explorarte}
      ORG_TASK_RECONCILER_ENABLED: ${ORG_TASK_RECONCILER_ENABLED:-true}
      ORG_TASK_RECONCILE_INTERVAL: ${ORG_TASK_RECONCILE_INTERVAL:-5s}
      ORG_TASK_RECONCILE_BATCH_SIZE: ${ORG_TASK_RECONCILE_BATCH_SIZE:-100}
      ORG_TASK_DEFAULT_MAX_ATTEMPTS: ${ORG_TASK_DEFAULT_MAX_ATTEMPTS:-5}
      ORG_TASK_DEFAULT_LEASE_DURATION: ${ORG_TASK_DEFAULT_LEASE_DURATION:-2m}
      ORG_TASK_MAX_LEASE_DURATION: ${ORG_TASK_MAX_LEASE_DURATION:-15m}
      ORG_TASK_RETRY_BASE_DELAY: ${ORG_TASK_RETRY_BASE_DELAY:-5s}
      ORG_TASK_RETRY_MAX_DELAY: ${ORG_TASK_RETRY_MAX_DELAY:-10m}
      ORG_TASK_OUTBOX_MAX_ATTEMPTS: ${ORG_TASK_OUTBOX_MAX_ATTEMPTS:-10}
      ORG_TASK_OUTBOX_CLAIM_DURATION: ${ORG_TASK_OUTBOX_CLAIM_DURATION:-1m}
      ORG_TASK_COMMAND_TIMEOUT: ${ORG_TASK_COMMAND_TIMEOUT:-30s}
      ORG_STAGING_ENABLED: ${ORG_STAGING_ENABLED:-false}
      ORG_STAGING_REPOSITORIES_FILE: ${ORG_STAGING_REPOSITORIES_FILE:-/etc/explorarte/repositories.yaml}
      ORG_STAGING_WORKSPACE_ROOT: ${ORG_STAGING_WORKSPACE_ROOT:-/var/lib/explorarte/staging/workspaces}
      ORG_STAGING_ARTIFACT_ROOT: ${ORG_STAGING_ARTIFACT_ROOT:-/var/lib/explorarte/staging/artifacts}
      ORG_STAGING_QUARANTINE_ROOT: ${ORG_STAGING_QUARANTINE_ROOT:-/var/lib/explorarte/staging/quarantine}
      ORG_STAGING_COMMAND_TIMEOUT: ${ORG_STAGING_COMMAND_TIMEOUT:-2m}
      ORG_STAGING_MAX_ARTIFACT_BYTES: ${ORG_STAGING_MAX_ARTIFACT_BYTES:-67108864}
      ORG_STAGING_MAX_CHANGED_FILES: ${ORG_STAGING_MAX_CHANGED_FILES:-500}
      ORG_STAGING_STALE_AFTER: ${ORG_STAGING_STALE_AFTER:-30m}
      ORG_STAGING_RECONCILE_INTERVAL: ${ORG_STAGING_RECONCILE_INTERVAL:-30s}
      ORG_STAGING_RECONCILE_BATCH_SIZE: ${ORG_STAGING_RECONCILE_BATCH_SIZE:-100}
      ORG_STAGING_GIT_BINARY: ${ORG_STAGING_GIT_BINARY:-git}
      # Trusted runtime configuration for internal/coderunner.Worker.
      # RepositoryID/BaseCommit/TargetRef are only the STARTUP-VALIDATION
      # default (cmd/orgctl/code_runner.go refuses to start if any of
      # these five are empty) -- every real engineering-mission task
      # overrides base/target per-task via engineeringmission.
      # WorkspaceResolver reading that mission's own durably-stored
      # BaseSHA (internal/coderunner/staging_adapter.go:Open), never this
      # static value. Confirmed by reading that resolution path before
      # setting these.
      ORG_CODE_RUNNER_PRINCIPAL_ID: "22"
      ORG_CODE_RUNNER_WORKER_ID: code-runner-01
      ORG_CODE_RUNNER_REPOSITORY_ID: explorarte-organization
      ORG_CODE_RUNNER_BASE_COMMIT: 599e5d78a5280b31dbdd37fb7e172270609148c8
      ORG_CODE_RUNNER_TARGET_REF: refs/heads/main
      GOCACHE: /tmp/go-cache
      GOMODCACHE: /tmp/go-mod
      GOFLAGS: -mod=mod
    volumes:
      - /etc/explorarte/repositories.yaml:/etc/explorarte/repositories.yaml:ro
      - /etc/explorarte/secrets/code-runner-identity.pem:/run/secrets/code-runner-identity.pem:ro
      - /var/lib/explorarte/staging/repo/explorarte-organization:/var/lib/explorarte/staging/repo/explorarte-organization
      - /var/lib/explorarte/staging/workspaces:/var/lib/explorarte/staging/workspaces
      - /var/lib/explorarte/staging/artifacts:/var/lib/explorarte/staging/artifacts
      - /var/lib/explorarte/staging/quarantine:/var/lib/explorarte/staging/quarantine
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,size=2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Matches ORG-AUDIT-008's own reasoning for model-worker: process
      # liveness only, not proof of forward progress.
      test: ["CMD-SHELL", "pgrep -f 'orgctl code-runner worker run' > /dev/null"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      - postgres
    networks:
      - org-internal

volumes:
  # ORG-AUDIT-007 pinned this to the project name so worktree Compose
  # projects would never collide with production over the same volume --
  # correct intent, wrong layer. On 2026-08-14 that meant a real
  # `docker compose up` against production silently resolved a *different*,
  # brand-new, empty volume (explorarte-organization_postgres-data) instead
  # of the durable production volume (explorarte-org-postgres-data),
  # because postgres was recreated under the now-default project-namespaced
  # name. Production data was never touched only because the run was caught
  # before anything wrote to the new volume -- see CUTOVER-DEPLOYMENT-
  # REHEARSAL-003. A production DB's physical identity must not change
  # when orchestration config (project name) changes. Worktree isolation
  # still belongs in COMPOSE_PROJECT_NAME/--project-name, and worktrees
  # that need their own Postgres get their own explicit override name
  # (rehearsal-NNN-postgres-data, worker-X-postgres-data, ...), not a
  # collision with this one.
  postgres-data:
    name: explorarte-org-postgres-data

networks:
  # ORG-AUDIT-007: same reasoning as the volume above -- but the network
  # is not a durable data resource. Recreating it under a project-namespaced
  # name is harmless (no data lives in a network), so it stays unpinned.
  org-internal:
    driver: bridge
